apiVersion: v1
kind: Namespace
metadata:
  name: agent-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-mlflow-agent-demo
  namespace: agent-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-mlflow-agent-demo-writer
  namespace: agent-demo
rules:
  - apiGroups:
      - mlflow.kubeflow.org
    resources:
      - experiments
    verbs:
      - get
      - list
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-mlflow-agent-demo-writer
  namespace: agent-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-mlflow-agent-demo-writer
subjects:
  - kind: ServiceAccount
    name: maas-mlflow-agent-demo
    namespace: agent-demo
